 <!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office — Credencial Estudantil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --orange:#f97316;
  --orange-dark:#c2410c;
  --orange-soft:#fff1e6;
  --turquoise:#0ea5a5;
  --turquoise-dark:#0b6e6e;
  --turquoise-deep:#064e4e;
  --turquoise-soft:#e4f7f6;
  --ink:#12302e;
  --muted:#5f7775;
  --background:#f4f8f7;
  --surface:#fff;
  --border:#d9e7e4;
  --green:#16a34a;
  --green-soft:#dcfce7;
  --red:#dc2626;
  --red-soft:#fee2e2;
  --yellow:#b45309;
  --yellow-soft:#fef3c7;
  --radius:20px;
  --shadow:0 18px 45px -25px rgba(6,78,78,.4);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 0 0,rgba(14,165,165,.1),transparent 32%),
    radial-gradient(circle at 100% 100%,rgba(249,115,22,.1),transparent 30%),
    var(--background);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif}
a{color:inherit}

#app{max-width:1120px;margin:auto;padding:0 18px 60px}
.topbar{
  max-width:1120px;margin:0 auto 18px;padding:16px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(135deg,var(--turquoise),var(--turquoise-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 25px -15px var(--turquoise-dark);
}
.brand-name{font:800 21px Sora;letter-spacing:-.05em}
.brand-name span{color:var(--orange)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  border:0;border-radius:12px;padding:11px 16px;
  font-size:14px;font-weight:700;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;
  transition:.15s;box-shadow:0 10px 20px -16px var(--turquoise-dark);
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--turquoise-dark),var(--turquoise));color:white}
.btn-orange{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:white}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:8px 11px;font-size:12.5px;border-radius:9px}

.panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)
}
.muted{color:var(--muted)}
.small{font-size:12.5px;color:var(--muted)}
.label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:16px}
input,select,textarea{
  width:100%;height:46px;padding:0 13px;
  color:var(--ink);background:var(--surface);
  border:1.5px solid var(--border);border-radius:12px;
  outline:0;transition:.15s
}
input:focus,select:focus,textarea:focus{
  border-color:var(--turquoise);
  box-shadow:0 0 0 4px rgba(14,165,165,.12)
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:18px
}
.section-head h2{margin:0;font-size:24px}
.hero{text-align:center;padding:55px 10px 30px}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.1;margin:0 0 16px}
.hero p{max-width:610px;margin:0 auto 28px;color:var(--muted);font-size:16px;line-height:1.7}
.hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pill{
  display:inline-flex;padding:8px 14px;border-radius:999px;
  background:var(--turquoise-soft);color:var(--turquoise-deep);
  font-weight:800;font-size:12px;margin-bottom:20px
}

.toast{
  position:fixed;z-index:20;left:50%;bottom:22px;transform:translate(-50%,20px);
  background:var(--ink);color:white;padding:13px 18px;border-radius:12px;
  opacity:0;pointer-events:none;transition:.2s;font-size:14px;font-weight:700
}
.toast.show{opacity:1;transform:translate(-50%,0)}
hr{border:0;border-top:1px solid var(--border);margin:24px 0}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:12px;color:var(--muted)}
.status{
  display:inline-flex;align-items:center;padding:5px 10px;
  border-radius:999px;font-size:11px;font-weight:800
}
.active{color:var(--green);background:var(--green-soft)}
.inactive{color:var(--red);background:var(--red-soft)}
.expired{color:var(--yellow);background:var(--yellow-soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.stat strong{font:800 28px Sora;display:block}
.stat span{font-size:12px;color:var(--muted)}
.notice{
  background:var(--orange-soft);border:1px solid #fed7aa;
  color:#9a3412;border-radius:12px;padding:12px;font-size:12.5px;
  line-height:1.5;margin-bottom:18px
}
.empty{text-align:center;color:var(--muted);padding:30px}
.avatar{
  width:115px;height:125px;border:2px dashed var(--border);
  border-radius:15px;background:var(--turquoise-soft);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:pointer;font-size:30px
}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- CARTÃO REDIMENSIONADO ---------- */
.student-card{
  position:relative;
  width:390px;
  max-width:94vw;
  aspect-ratio:1.58;
  overflow:hidden;
  border-radius:22px;
  color:var(--ink);
  background:#ffffff;
  box-shadow:0 20px 45px -20px rgba(0,0,0,.35);
  border:1px solid rgba(0,0,0,.12);
  -webkit-print-color-adjust:exact !important;
  print-color-adjust:exact !important;
}

.front-header{
  min-height:60px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:white;
  background:linear-gradient(105deg,#064e4e 0%,#0b6e6e 32%,#0ea5a5 57%,#f97316 100%);
}

.card-brand{display:flex;align-items:center;min-width:24px;flex:1 1 auto;overflow:hidden}

.card-logo-front{
  width:100%;
  max-width:150px;
  min-width:70px;
  height:auto;
  object-fit:contain;
  display:block;
  background:transparent !important;
  border-radius:0;
  filter:none;
}

.header-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  flex:none;
}

.card-type{
  font-size:6.3px;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:800;
  white-space:nowrap;
  text-align:right;
}

.header-right .status{
  font-size:8.5px;
  padding:3px 8px;
  white-space:nowrap;
}

.card-front-body{
  padding:10px 13px 5px;
}

.card-person{
  display:flex;
  gap:9px;
  align-items:flex-start;
  min-width:0;
}

.card-info{
  flex:1;
  min-width:0;
}

.card-photo{
  display:flex;align-items:center;justify-content:center;
  font:800 18px Sora;color:var(--turquoise-deep);
  width:65px;
  height:76px;
  flex:none;
  border-radius:10px;
  background:var(--turquoise-soft);
  overflow:hidden;
  border:2px solid white;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
  margin-top:-18px;
}

.card-photo img{width:100%;height:100%;object-fit:cover}

.card-name{
  font:800 13px Sora;
  line-height:1.15;
  margin:2px 0 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

.card-course{
  font-size:9px;
  color:var(--muted);
  margin:0;
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-fields{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:5px 9px;
  margin-top:9px;
}

.card-field{min-width:0}

.card-field label{
  display:block;
  font-size:6.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:800;
}

.card-field b{
  display:block;
  font-size:8.5px;
  margin-top:2px;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

.card-watermark{
  position:absolute;
  bottom:4px;
  right:9px;
  color:var(--orange);
  opacity:.16;
  font:800 21px Sora;
}

/* ---------- VERSO DO CARTÃO ----------
   Tudo em "cqw" (1cqw = 1% da largura do cartão): o verso escala junto com o cartão,
   ficando idêntico na tela e na impressão, e o conteúdo nunca passa da altura. */
.card-area{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start}
.back-card{
  container-type:inline-size;
  background:linear-gradient(145deg,var(--turquoise-soft),#fff 62%);
}
.back-bar{
  position:absolute;left:0;right:0;height:2.4cqw;
  background:linear-gradient(90deg,var(--orange),var(--turquoise));
}
.back-bar.top{top:0}
.back-bar.bottom{bottom:0}
.back-inner{
  position:absolute;inset:0;
  display:flex;align-items:stretch;gap:3.2cqw;
  padding:4.4cqw 4cqw;
}
.back-qr{flex:none;width:36cqw;display:flex;align-items:center}
.qr-box{
  width:100%;background:#fff;padding:2cqw;border-radius:2cqw;
  box-shadow:0 1cqw 3cqw rgba(0,0,0,.15);line-height:0;
}
.qr-box img,.qr-box canvas{display:block;width:100%;height:auto}
.back-info{
  flex:1;min-width:0;display:flex;flex-direction:column;
  gap:.9cqw;overflow:hidden;text-align:left;
}
.back-info>:first-child{margin-top:auto}
.back-info>:last-child{margin-bottom:auto}
.card-logo-back{
  display:block;flex:none;
  height:9cqw;width:auto;max-width:100%;
  object-fit:contain;object-position:left center;
  align-self:flex-start;margin-bottom:.6cqw;
  background:transparent;
}
.back-card h4{
  font-family:Sora,Inter,sans-serif;font-weight:800;
  font-size:calc(3.1cqw * var(--fs,1));line-height:1.15;
  margin:0;color:var(--turquoise-deep);
}
.back-card p{
  font-size:calc(2.5cqw * var(--fs,1));line-height:1.2;
  color:var(--muted);margin:0;
}
.back-card p.back-id{color:var(--ink)}
.back-card p.back-contact{font-size:calc(2.3cqw * var(--fs,1));font-weight:600}
.rules{
  text-align:left;width:100%;
  font-size:calc(2.15cqw * var(--fs,1));
  color:var(--muted);line-height:1.22;margin-top:.5cqw;
}
.rules div{padding-left:2cqw;text-indent:-2cqw}
.rules div:before{content:"• ";color:var(--orange);font-weight:800}

.public-result{max-width:600px;margin:20px auto}
.verdict{font:800 21px Sora;margin-bottom:8px}
.valid-box{border:2px solid var(--green);background:var(--green-soft)}
.invalid-box{border:2px solid var(--red);background:var(--red-soft)}
.public-data{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:500px){.public-data{grid-template-columns:1fr}}
.footer{
  text-align:center;color:var(--muted);font-size:12px;
  border-top:1px solid var(--border);padding-top:18px;margin-top:50px
}

/* ===== Ajuste de impressão ===== */
@media print{
  @page{
    size:A4;
    margin:10mm;
  }

  html,body{
    background:#fff !important;
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }

  body *{
    visibility:hidden !important;
  }

  #print-area,
  #print-area *{
    visibility:visible !important;
  }

  #print-area{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    padding:0;
    background:#fff !important;
  }

  .card-area{
    display:flex !important;
    flex-direction:row !important;
    flex-wrap:nowrap !important;
    justify-content:center !important;
    align-items:flex-start !important;
    gap:8mm !important;
    page-break-inside:avoid !important;
    break-inside:avoid !important;
  }

  .student-card{
    flex:none !important;
    box-shadow:none !important;
    width:85.6mm !important;
    height:54mm !important;
    max-width:none !important;
    aspect-ratio:auto !important;
    overflow:hidden !important;
    page-break-inside:avoid !important;
    break-inside:avoid !important;
  }

  .front-header{
    height:13mm !important;
  }

  .card-logo-front{
    width:36mm !important;
    height:auto !important;
  }

  .card-front-body{
    padding:2.5mm 3mm 1mm !important;
  }

  .card-photo{
    width:16mm !important;
    height:19mm !important;
    margin-top:-5mm !important;
  }

  .card-name{
    font-size:9pt !important;
    max-width:48mm !important;
  }

  .card-course{
    font-size:6.5pt !important;
    max-width:48mm !important;
  }

  .card-fields{
    gap:1.2mm 2.5mm !important;
    margin-top:2.5mm !important;
  }

  .card-field label{
    font-size:4.5pt !important;
  }

  .card-field b{
    font-size:5.5pt !important;
    max-width:30mm !important;
  }

  .header-right .status{
    font-size:5pt !important;
    padding:1.2mm 2.2mm !important;
  }

  .qr-box img{image-rendering:pixelated}

  .no-print{
    display:none !important;
  }
}
</style>

function readList(key,fallback){
  try{
    const v=JSON.parse(localStorage.getItem(key)||"null");
    return Array.isArray(v)?v:fallback
  }catch(e){return fallback}
}
function getStudents(){return readList(DB_KEY,[])}
function saveStudents(data){
  const json=JSON.stringify(data);
  localStorage.setItem(DB_KEY,json);
  try{localStorage.setItem(BACKUP_KEY,json)}catch(e){}
}
/* Roda uma vez ao abrir: NUNCA apaga carteirinhas. Só restaura da cópia de segurança
   (se o principal sumiu) e acrescenta as que estão embutidas no arquivo. */
function initDB(){
  const main=readList(DB_KEY,null);
  let list=main?main.slice():[];
  if(!list.length){
    const backup=readList(BACKUP_KEY,[]);
    if(backup.length)list=backup.slice();
  }
  const deleted=new Set(readList(DELETED_KEY,[]));
  const ids=new Set(list.map(x=>x.id));
  let added=0;
  SEED_DB.forEach(st=>{
    if(st&&st.id&&!ids.has(st.id)&&!deleted.has(st.id)){list.push(st);ids.add(st.id);added++}
  });
  if(list.length)saveStudents(list);   // regrava o principal (nunca menor) e cria/atualiza a cópia
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
async function downloadFile(name,text,type){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){
      try{await dl.save({filename:name,data:text})}
      catch(e){if(!e||e.code!=="declined")toast("Não foi possível salvar o arquivo.")}
      return
    }
  }catch(e){}
  const blob=new Blob([text],{type});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function exportDB(){
  const list=getStudents();
  downloadFile(`office-banco-${today()}.json`,JSON.stringify({app:"office",version:1,exportedAt:new Date().toISOString(),students:list},null,2),"application/json");
  toast(`Backup salvo com ${list.length} carteirinha(s).`);
}
function importDB(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const incoming=Array.isArray(data)?data:data.students;
      if(!Array.isArray(incoming))throw new Error("formato");
      const list=getStudents();
      const ids=new Set(list.map(x=>x.id));
      const cpfs=new Set(list.map(x=>x.cpf));
      let added=0;
      incoming.forEach(st=>{
        if(st&&st.id&&st.name&&!ids.has(st.id)&&!cpfs.has(st.cpf)){list.push(st);ids.add(st.id);cpfs.add(st.cpf);added++}
      });
      saveStudents(list);
      const back=new Set(incoming.map(x=>x&&x.id));
      localStorage.setItem(DELETED_KEY,JSON.stringify(readList(DELETED_KEY,[]).filter(x=>!back.has(x))));
      toast(`${added} carteirinha(s) importada(s). Nenhuma existente foi apagada.`);
      configPage();
    }catch(e){toast("Arquivo de backup inválido.")}
  };
  reader.readAsText(file);
  event.target.value="";
}
/* gera uma cópia deste sistema com todas as carteirinhas gravadas dentro do arquivo */
function downloadFixedHTML(){
  const clone=document.documentElement.cloneNode(true);
  const app=clone.querySelector("#app");if(app)app.innerHTML="";
  const t=clone.querySelector("#toast");if(t){t.className="toast";t.textContent=""}
  const data=JSON.stringify(getStudents()).replace(/</g,"\\u003c");
  const re=new RegExp("/\\*SEED_"+"START\\*/[\\s\\S]*?/\\*SEED_"+"END\\*/");
  let html="<!doctype html>\n"+clone.outerHTML;
  if(!re.test(html)){toast("Não foi possível gerar o arquivo.");return}
  html=html.replace(re,()=>"/*SEED_"+"START*/const SEED_DB="+data+";/*SEED_"+"END*/");
  downloadFile("office_credencial.html",html,"text/html");
  toast("Arquivo gerado com o banco de dados embutido.");
}
function getConfig(){
  try{return {...defaultConfig,...JSON.parse(localStorage.getItem(CONFIG_KEY)||"{}")}}
  catch(e){return {...defaultConfig}}
}
function saveConfig(c){localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}
function session(){return sessionStorage.getItem(SESSION_KEY)}
function logged(){return session()===ADMIN_USER}
function uid(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result="";
  for(let i=0;i<8;i++)result+=chars[Math.floor(Math.random()*chars.length)];
  return "OFF-"+new Date().getFullYear()+"-"+result;
}
function today(){ return new Date().toISOString().slice(0,10) }
function futureDate(months){
  const d=new Date();
  d.setMonth(d.getMonth()+Number(months||12));
  return d.toISOString().slice(0,10)
}
function onlyDigits(value){return String(value||"").replace(/\D/g,"")}
function cpfFormat(value){
  const v=onlyDigits(value).slice(0,11);
  if(v.length<=3)return v;
  if(v.length<=6)return v.replace(/(\d{3})(\d+)/,"$1.$2");
  if(v.length<=9)return v.replace(/(\d{3})(\d{3})(\d+)/,"$1.$2.$3");
  return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,"$1.$2.$3-$4");
}
function validCPF(value){
  const cpf=onlyDigits(value);
  if(cpf.length!==11||/^(\d)\1{10}$/.test(cpf))return false;
  let sum=0;
  for(let i=0;i<9;i++)sum+=Number(cpf[i])*(10-i);
  let d=(sum*10)%11;if(d===10)d=0;
  if(d!==Number(cpf[9]))return false;
  sum=0;
  for(let i=0;i<10;i++)sum+=Number(cpf[i])*(11-i);
  d=(sum*10)%11;if(d===10)d=0;
  return d===Number(cpf[10]);
}
function dateBR(value){
  if(!value)return "—";
  const [y,m,d]=value.split("-");
  return `${d}/${m}/${y}`;
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]))
}
function statusOf(student){
  if(student.status==="INATIVA")return "INATIVA";
  if(student.validity && student.validity<today())return "EXPIRADA";
  return "ATIVA";
}
function statusHTML(status){
  const data={
    ATIVA:["active","Ativa"],
    INATIVA:["inactive","Inativa"],
    EXPIRADA:["expired","Expirada"]
  }[status]||["inactive",status];
  return `<span class="status ${data[0]}">${data[1]}</span>`;
}
function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}
function go(hash){location.hash=hash}
function requireAdmin(){
  if(!logged()){go("#/login");return false}
  return true
}

/* ---- QR Code: os dados da carteirinha vão DENTRO do link, então qualquer celular
   consegue abrir e ver a carteirinha, sem depender do banco deste computador. ---- */
const MOD_LIST=["Presencial","EAD","Híbrido"];
function hash36(str){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36).slice(0,7)
}
function b64uEncode(str){
  const bytes=new TextEncoder().encode(str);
  let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")
}
function b64uDecode(str){
  str=str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  const bin=atob(str);
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))
}
function encodeQR(st){
  const clean=v=>String(v||"").replace(/\|/g," ").trim();
  const mod=MOD_LIST.indexOf(st.modality);
  const fields=[
    st.id,clean(st.name),onlyDigits(st.cpf),String(st.birth||"").replace(/-/g,""),
    clean(st.institution),clean(st.course),mod>=0?String(mod):clean(st.modality),
    String(st.issue||"").replace(/-/g,""),String(st.validity||"").replace(/-/g,""),
    st.status==="INATIVA"?"I":"A"
  ];
  const body=fields.join("|");
  return b64uEncode(body+"|"+hash36(body+QR_SALT))
}
function decodeQR(payload){
  try{
    const parts=b64uDecode(payload||"").split("|");
    if(parts.length!==11)return null;
    const sum=parts.pop();
    if(hash36(parts.join("|")+QR_SALT)!==sum)return null;
    const [id,name,cpf,birth,institution,course,mod,issue,validity,st]=parts;
    const d=v=>v.length===8?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6)}`:"";
    return {
      id,name,cpf,birth:d(birth),institution,course,
      modality:/^\d$/.test(mod)?(MOD_LIST[Number(mod)]||"Presencial"):mod,
      issue:d(issue),validity:d(validity),status:st==="I"?"INATIVA":"ATIVA"
    }
  }catch(e){return null}
}
function qrBaseURL(){
  const custom=(getConfig().publicUrl||"").trim().split("#")[0];
  return custom||location.href.split("#")[0]
}
function qrURL(student){return `${qrBaseURL()}#/c/${encodeQR(student)}`}
function qrProblem(){
  const b=qrBaseURL();
  if(/^file:/i.test(b)||/^https?:\/\/(localhost|127\.|0\.0\.0\.0)/i.test(b))
    return "⚠️ <b>O QR Code só abre no celular se o sistema estiver publicado na internet.</b> Este arquivo está sendo aberto direto do computador. Publique-o (Netlify, GitHub Pages, etc.) e informe o endereço em <a href=\"#/config\">Configurações → Endereço público</a>. Depois disso, gere a impressão novamente.";
  return ""
}
function openQR(id){
  const st=getStudents().find(x=>x.id===id);
  if(st)window.open(qrURL(st),"_blank")

function copyQR(id){
  const st=getStudents().find(x=>x.id===id);
  if(!st)return;
  const url=qrURL(st);
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
    .then(()=>toast("Link do QR copiado."))
    .catch(()=>prompt("Copie o link do QR:",url))
}

function readPhoto(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      canvas.width=350;canvas.height=420;
      const ctx=canvas.getContext("2d");
      const scale=Math.max(canvas.width/img.width,canvas.height/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
      const data=canvas.toDataURL("image/jpeg",.82);
      document.getElementById("photoData").value=data;
      document.querySelector(".avatar").innerHTML=`<img src="${data}">`
    };
    img.src=reader.result
  };
  reader.readAsDataURL(file)
}
function saveStudent(event,id){
  event.preventDefault();
  const form=event.target;
  const data=Object.fromEntries(new FormData(form).entries());
  data.cpf=onlyDigits(data.cpf);
  if(!validCPF(data.cpf)){
    toast("Informe um CPF válido.");
    return false
  }
  if(data.validity<data.issue){
    toast("A validade não pode ser anterior à emissão.");
    return false
  }
  const list=getStudents();
  if(list.some(x=>x.cpf===data.cpf&&x.id!==id)){
    toast("Já existe uma carteirinha para este CPF.");
    return false
  }
  if(id){
    const index=list.findIndex(x=>x.id===id);
    list[index]={...list[index],...data};
    saveStudents(list);
    toast("Carteirinha atualizada.");
    go("#/card/"+id);
  }else{
    data.id=uid();
    data.createdAt=new Date().toISOString();
    list.push(data);
    saveStudents(list);
    toast("Carteirinha criada.");
    go("#/card/"+data.id);
  }
  return false
}

        <button class="btn btn-orange btn-sm" onclick="toggleStatus('${student.id}')">${status==="INATIVA"?"Reativar":"Desativar"}</button>`:""}
        <button class="btn btn-outline btn-sm" onclick="openQR('${student.id}')">Abrir página do QR</button>
        <button class="btn btn-outline btn-sm" onclick="copyQR('${student.id}')">Copiar link do QR</button>
        <button class="btn btn-primary btn-sm" onclick="window.print()">Imprimir / PDF</button>
      </div>
    </div>
    ${problem?`<div class="notice no-print">${problem}</div>`:""}
    <div id="print-area">
      <div class="card-area">
        ${cardFrontHTML(student)}
        ${cardBackHTML(student,config)}
      </div>
    </div>
    ${footer()}`
  const holder=document.getElementById("qr-"+student.id);
  if(holder){
    if(window.QRCode){
      try{
        const text=qrURL(student);
        const opt={text,colorDark:"#063d3d",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M};
        /* descobre quantos módulos o QR tem e desenha com 10px exatos por módulo:
           módulos com tamanho inteiro ficam nítidos e leem muito melhor no celular */
        let size=520;
        try{
          const probe=new QRCode(document.createElement("div"),{...opt,width:256,height:256});
          const n=probe._oQRCode&&probe._oQRCode.getModuleCount();
          if(n>0)size=n*10;
        }catch(e){}
        new QRCode(holder,{...opt,width:size,height:size})
      }catch(e){
        holder.innerHTML=`<div style="font:600 10px Inter;line-height:1.3;padding:6px;color:#b91c1c">Não foi possível gerar o QR Code.</div>`
      }
    }else{
      holder.innerHTML=`<div style="font:600 10px Inter;line-height:1.3;padding:6px;color:#b91c1c">Biblioteca de QR Code não carregou. Verifique a internet e recarregue.</div>`
    }
  }
  fitBackInfo();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBackInfo);
}
function field(label,value){
  return `<div class="card-field"><label>${escapeHTML(label)}</label><b>${escapeHTML(value||"—")}</b></div>`
}
function toggleStatus(id){
  const list=getStudents();
  const index=list.findIndex(x=>x.id===id);
  if(index<0)return;
  list[index].status=list[index].status==="INATIVA"?"ATIVA":"INATIVA";
  saveStudents(list);
  toast("Status atualizado.");
  drawCardPage(list[index],true)
}

/* consulta pública */
function consulta(){
  document.getElementById("app").innerHTML=`
    ${topbar()}
    <div class="public-result">
      <div class="panel">
        <h2 style="margin-top:0">Consultar credencial</h2>
        <p class="muted">Informe o CPF para verificar a situação da credencial estudantil.</p>
        <form onsubmit="return publicSearch(event)">
          <div class="field">
            <label class="label">CPF</label>
            <input name="cpf" maxlength="14" required placeholder="000.000.000-00" oninput="this.value=cpfFormat(this.value)">
          </div>
          <button class="btn btn-primary" style="width:100%">Consultar</button>
        </form>
      </div>
      <div id="publicResult"></div>
    </div>
    ${footer()}`
}
function publicSearch(event){
  event.preventDefault();
  const cpf=onlyDigits(event.target.cpf.value);
  const student=getStudents().find(x=>x.cpf===cpf);
  const box=document.getElementById("publicResult");
  if(!student){
    box.innerHTML=`<div class="panel invalid-box" style="margin-top:18px"><div class="verdict">❌ Credencial não encontrada</div><p>Não existe uma credencial cadastrada para o CPF informado.</p></div>`;
    return false
  }
  publicStudent(student);
  return false
}
function publicStudent(student){
  const config=getConfig();
  const status=statusOf(student);
  const valid=status==="ATIVA";
  document.getElementById("publicResult").innerHTML=`
    <div class="panel ${valid?"valid-box":"invalid-box"}" style="margin-top:18px">
      <div class="verdict">${valid?"✅ CREDENCIAL VÁLIDA":"❌ CREDENCIAL NÃO VÁLIDA"}</div>
      <p>${valid?"Os dados correspondem a uma credencial ativa.":status==="EXPIRADA"?"Esta credencial está expirada.":"Esta credencial está inativa."}</p>
      <hr>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        ${config.showPhoto&&student.photo?`<div class="card-photo" style="margin:0"><img src="${student.photo}"></div>`:""}
        <div>
          <h3 style="margin:0 0 5px">${escapeHTML(student.name)}</h3>
          <div class="muted">${escapeHTML(student.institution)}</div>
          <div class="muted">${escapeHTML(student.course)}</div>
        </div>
      </div>
      <div class="public-data">
        <div><span class="small">ID da credencial</span><br><b>${escapeHTML(student.id)}</b></div>
        <div><span class="small">Validade</span><br><b>${dateBR(student.validity)}</b></div>
        <div><span class="small">CPF</span><br><b>${cpfFormat(student.cpf)}</b></div>
        <div><span class="small">Emissão</span><br><b>${dateBR(student.issue)}</b></div>
      </div>
      <p class="small" style="margin-bottom:0;margin-top:18px">
        Office — credencial digital de demonstração. Não substitui documentos oficiais.
      </p>
    </div>`
}

/* validação pelo QR */
function validatePage(id){
  const student=getStudents().find(x=>x.id===decodeURIComponent(id||""));
  document.getElementById("app").innerHTML=`
    ${topbar()}
    <div class="public-result">
      <div class="panel" style="text-align:center">
        <div class="pill">VERIFICAÇÃO POR QR CODE</div>
        <h2 style="margin:0">Office</h2>
        <p class="muted">Resultado da consulta da credencial.</p>
      </div>
      <div id="publicResult"></div>
    </div>
    ${footer()}`
  if(!student){
    document.getElementById("publicResult").innerHTML=`<div class="panel invalid-box" style="margin-top:18px"><div class="verdict">❌ CREDENCIAL NÃO ENCONTRADA</div><p>Este QR Code é de um modelo antigo (só com o ID) e só funciona no aparelho onde a carteirinha foi cadastrada. Gere e imprima a carteirinha novamente para obter o QR novo.</p></div>`;
  }else publicStudent(student)
}

/* configurações */
function configPage(){
  if(!requireAdmin())return;
  const c=getConfig();
  document.getElementById("app").innerHTML=`
    ${topbar()}
    <div class="section-head"><h2>Configurações</h2></div>
    <div class="panel">
      <h3 style="margin-top:0">Informações exibidas no verso</h3>
      <form onsubmit="return saveSettings(event)">
        <div class="grid-2">
          <div class="field"><label class="label">Telefone</label><input name="phone" value="${escapeHTML(c.phone)}"></div>
          <div class="field"><label class="label">Instagram</label><input name="instagram" value="${escapeHTML(c.instagram)}"></div>
        </div>
        <div class="field"><label class="label">Site</label><input name="website" value="${escapeHTML(c.website)}"></div>
        <div class="field">
          <label class="label">Endereço público do sistema (usado no QR Code)</label>
          <input name="publicUrl" value="${escapeHTML(c.publicUrl||"")}" placeholder="https://seusite.com/office_credencial.html">
          <p class="small" style="margin:6px 0 0">Endereço onde este arquivo está publicado — é o que o celular abre ao escanear o QR Code. Se ficar vazio, usa o endereço atual desta página.</p>
        </div>
        <div class="field"><label class="label">Validade padrão em meses</label><input type="number" min="1" max="60" name="validityMonths" value="${c.validityMonths}"></div>
        <label class="label" style="margin-top:20px">Artigos da credencial — um por linha</label>
        <textarea name="articles" rows="7" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;resize:vertical">${escapeHTML(c.articles.join("\n"))}</textarea>
        <label style="display:flex;gap:8px;align-items:center;margin:18px 0;font-size:13px">
          <input type="checkbox" name="showPhoto" ${c.showPhoto?"checked":""} style="width:auto;height:auto">
          Exibir foto na consulta pública
        </label>
        <button class="btn btn-primary">Salvar configurações</button>
      </form>
    </div>
    <div class="panel" style="margin-top:18px">
      <h3 style="margin-top:0">Banco de dados</h3>
      <p class="small" style="margin-top:0">${getStudents().length} carteirinha(s) salva(s). Os dados ficam gravados neste navegador, com cópia automática de segurança, e não são apagados ao atualizar o sistema.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="exportDB()">Exportar backup (.json)</button>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">Importar backup</button>
        <button class="btn btn-orange btn-sm" onclick="downloadFixedHTML()">Baixar sistema com banco embutido</button>
      </div>
      <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importDB(event)">
      <p class="small" style="margin:14px 0 0">"Banco embutido" gera uma cópia deste arquivo já com todas as carteirinhas dentro dele: ao abrir em qualquer aparelho ou endereço, elas aparecem automaticamente. Importar backup só acrescenta o que falta — nada existente é apagado.</p>
    </div>
    <div class="panel" style="margin-top:18px">
      <h3 style="margin-top:0">Segurança</h3>
      <p class="small">Para alterar o usuário ou a senha, edite as constantes ADMIN_USER e ADMIN_PASSWORD no início do código.</p>
    </div>
    ${footer()}`
}
function saveSettings(event){
  event.preventDefault();
  const form=event.target;
  const c=getConfig();
  c.phone=form.phone.value.trim();
  c.instagram=form.instagram.value.trim();
  c.website=form.website.value.trim();
  c.validityMonths=Math.max(1,Number(form.validityMonths.value)||12);
  c.articles=form.articles.value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,8);
  let pu=form.publicUrl.value.trim().split("#")[0];
  if(pu&&!/^https?:\/\//i.test(pu))pu="https://"+pu;
  c.publicUrl=pu;
  c.showPhoto=form.showPhoto.checked;
  saveConfig(c);
  toast("Configurações salvas.");
  return false
}

initDB();
render();
</script>
</body>
